[project]
name = "jevgram"
version = "0.1.1"
description = "Classify text, PDF, and DOCX documents as AI- or human-authored using JEV. Like pangram, but lot cheaper"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ljubomir Buturovic", email = "ljubomir@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.19.0",
]
keywords = ["ai-detection", "authorship", "jev", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[project.scripts]
jevgram = "jevgram.cli:main"

[project.urls]
Homepage = "https://github.com/ljbuturovic/jevgram"
Repository = "https://github.com/ljbuturovic/jevgram"
Issues = "https://github.com/ljbuturovic/jevgram/issues"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
